# Server Configuration
server:
  port: 10101
  servlet:
    context-path: /camunda-masala-noodles

# Spring Configurations
spring:
  application:
    name: camunda-masala-noodles
  datasource:
    url: jdbc:h2:mem:batch-noodles-database
    driverClassName: org.h2.Driver
    username: sa
    password: password
    hikari:
      minimumIdle: 5
      maximumPoolSize: 50
      connectionTimeout: 2000
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        ddl-auto: create-update
        jdbc:
          lob:
            non_contextual_creation: false
  h2:
    console:
      enabled: true
      path: /h2-console
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
